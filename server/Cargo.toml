[package]
name = "server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#rcgen = "*"
rustls = "*"
rustls-pemfile = "*"
#hostname = "*"
#qrcode = "*"
#image = "*"
#local-ip-address = "*"
#iced = "*"
#quick-protobuf = "*"

#rusqlite = { version = "0.37.0", features = ["bundled"] }

diesel = { version = "2.2.0", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
dotenvy = "0.15"

toml = "0.8"

sha2 = "0.10"
md5 = "0.7"

prost = "0.12"
prost-types = "0.12"

tokio = { version = "1.38", features = ["full"] }
tokio-rustls = "0.26"

[build-dependencies]
prost-build = "0.12"